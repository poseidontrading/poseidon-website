<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Poseidon Labs LLC</title>
<meta name="description" content="Poseidon Labs LLC is a proprietary trading firm.">
<style>
  :root { --bg:#f7f6f4; --fg:#1a1a1a; --muted:#777; --accent:#2b6cb0; --rule:#d9d7d3; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--fg); font-family:Georgia, "Times New Roman", serif; padding:40px 44px; min-height:100vh; }
  .logo { font-family:Helvetica, Arial, sans-serif; font-size:22px; letter-spacing:.28em; font-weight:400; }
  main { margin-top:180px; max-width:900px; }
  section { display:grid; grid-template-columns:176px 1fr; padding:40px 0; }
  section + section { border-top:1px solid var(--rule); }
  .label { font-family:ui-monospace, Menlo, monospace; font-size:11px; letter-spacing:.08em; color:var(--muted); padding-top:8px; }
  .label b { color:var(--accent); font-weight:400; margin-right:6px; }
  .about { font-size:22px; line-height:1.4; }
  .rows { display:grid; grid-template-columns:112px 1fr; row-gap:14px; align-items:baseline; }
  .rows span { font-family:ui-monospace, Menlo, monospace; font-size:11px; letter-spacing:.08em; color:var(--muted); }
  a { color:var(--fg); font-family:Helvetica, Arial, sans-serif; font-size:15px; text-decoration:none; border-bottom:1px solid var(--rule); }
  a:hover { border-color:var(--fg); }
  .rows a { justify-self:start; }
  footer { margin-top:80px; font-family:ui-monospace, Menlo, monospace; font-size:11px; color:var(--muted); }
  @media (max-width:640px) {
    body { padding:28px 20px; }
    main { margin-top:100px; }
    section { grid-template-columns:1fr; row-gap:16px; }
    .label { padding-top:0; }
  }
</style>
</head>
<body>
  <div class="logo">poseidon labs</div>
  <main>
    <section>
      <div class="label"><b>01</b>ABOUT</div>
      <p class="about">Poseidon Labs is a proprietary trading firm.</p>
    </section>
    <section>
      <div class="label"><b>02</b>CONTACT</div>
      <div class="rows">
        <span>GENERAL</span><a href="mailto:contact@poseidontrading.xyz">contact@poseidontrading.xyz</a>
        <span>CAREERS</span><a href="mailto:trading@poseidontrading.xyz">careers@poseidontrading.xyz</a>
      </div>
    </section>
    <footer>&copy; 2026 Poseidon Labs LLC</footer>
  </main>
</body>
</html>
